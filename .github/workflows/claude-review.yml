name: claude-review

# Automatic Claude review on PR creation/update, via Bedrock (OIDC, no
# long-lived tokens). Self-contained: uses upstream claude-code-action
# defaults directly rather than the org reusable workflows, so upstream
# fixes arrive via the floating @v1 with no central re-tag.
#
# Review guidance lives in .github/claude-review-prompt.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  review:
    # Same-repo branch PRs only: fork PRs must not trigger reviews (no
    # Bedrock spend on unvetted code, and fork PRs can't mint the OIDC
    # token anyway — this guard is belt-and-braces). Branch PRs can only
    # be created by people with write access, i.e. org members.
    # Bot-authored PRs (dependabot, changesets) are also skipped.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_REVIEW_ROLE_ARN }}
          aws-region: us-east-2

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: 'true'
          additional_permissions: |
            actions: read
          track_progress: true
          claude_args: |
            --model global.anthropic.claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__download_job_log,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .github/claude-review-prompt.md in the checked-out repo
            and review this pull request following its guidance.
