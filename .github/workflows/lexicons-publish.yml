name: Lexicons Publish

on:
  push:
    branches: [main]
    paths: [lexicons/**]

permissions:
  contents: read

# Serialize publishes so merges land on the network in order. No
# cancel-in-progress: a started publish should finish.
concurrency: lexicons-publish

jobs:
  publish:
    if: github.repository == 'bluesky-social/bsky'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      # Node 24 runs the .ts scripts directly via default type stripping
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install goat
        run: go install github.com/bluesky-social/goat@v0.2.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fail loudly before publishing if any non-carveout group lacks DNS;
      # goat would otherwise skip it with only a WARN. Prints the full
      # group -> status table (stderr) into the logs.
      - name: DNS audit
        run: node .github/scripts/lex-check-dns.ts --all > /dev/null
      - name: Publish lexicons
        env:
          GOAT_USERNAME: ${{ secrets.LEX_PUBLISH_HANDLE }}
          GOAT_PASSWORD: ${{ secrets.LEX_PUBLISH_APP_PASSWORD }}
        # --update allows modifying existing records; safe because the
        # breaking check gated the PR. Publish skips schemas identical to
        # what is live, so re-runs are idempotent.
        run: goat lex publish --update
